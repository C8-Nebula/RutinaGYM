<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Rutina Gym | Cuestionario</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
    header { background-color: #2c3e50; color: white; text-align: center; padding: 1.5rem; }
    nav { background-color: #34495e; padding: 0.5rem; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
    main { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; }
    .question { margin-bottom: 20px; }
    .btn { background: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>Cuestionario de Evaluación</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a> |
    <a href="cuestionario.html">Evaluación</a> |
    <a href="resultados.html">Resultados</a>
  </nav>

  <main>
    <form action="resultados.html" method="GET">
      
      <div class="question">
        <h3>1. ¿Cuál es tu experiencia previa en el gimnasio?</h3>
        <label><input type="radio" name="q1" value="0" required> Es mi primera vez</label><br>
        <label><input type="radio" name="q1" value="1"> He ido hace meses pero dejé de ir</label><br>
        <label><input type="radio" name="q1" value="2"> Llevo entrenando seguido más de 6 meses</label>
      </div>

      <div class="question">
        <h3>2. ¿Cuántos días a la semana puedes entrenar?</h3>
        <label><input type="radio" name="q2" value="3" required> 2 a 3 días</label><br>
        <label><input type="radio" name="q2" value="4"> 4 a 5 días</label>
      </div>

      <div class="question">
        <h3>3. ¿Cuál es tu objetivo principal?</h3>
        <label><input type="radio" name="q3" value="salud" required> Ganar salud y moverme más</label><br>
        <label><input type="radio" name="q3" value="musculo"> Ganar masa muscular</label><br>
        <label><input type="radio" name="q3" value="grasa"> Perder grasa</label>
      </div>

      <button type="submit" class="btn">Ver Mis Resultados</button>
    </form>
  </main>

</body>
</html>
